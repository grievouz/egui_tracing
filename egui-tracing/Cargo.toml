[package]
name = "egui_tracing"
description = "Integrates tracing and logging with egui for event collection/visualization"
version = "0.4.0"
edition = "2021"
license = "Unlicense"
repository = "https://github.com/grievouz/egui_tracing"
keywords = ["egui", "tracing", "log"]
categories = ["gui", "game-development"]

[features]
default = ["log", "egui-default"]
time = ["dep:time"]
# egui 0.37 no longer includes bundled fonts in its default features.
egui-default = ["egui/default", "egui/default_fonts"]
log = ["tracing-log", "tracing-subscriber/tracing-log"]
# Kept for compatibility; wasm32 targets enable browser clock support automatically.
wasmbind = ["chrono/wasmbind"]

[dependencies]
chrono = { workspace = true, features = ["clock"] }
egui = { workspace = true }
egui_extras = { workspace = true }
time = { version = "0.3.55", optional = true, default-features = false, features = ["std"] }
imbl = "7"
globset = "0.4"
tracing = { workspace = true, default-features = false }
tracing-log = { version = "0.2", optional = true, default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
unicode-segmentation = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
time = { version = "0.3.55", optional = true, default-features = false, features = ["wasm-bindgen"] }
chrono = { workspace = true, features = ["wasmbind"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
